services:
  - type: web
    runtime: static
    name: ecobite-frontend
    plan: starter
    rootDir: frontend
    buildCommand: yarn install --frozen-lockfile && yarn build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    runtime: node
    name: ecobite-backend
    plan: starter
    rootDir: backend
    buildCommand: yarn install --frozen-lockfile
    startCommand: yarn start