services:
  - type: web
    runtime: static
    name: ecobite-frontend
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    runtime: node
    name: ecobite-backend
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start